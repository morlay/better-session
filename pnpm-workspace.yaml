# 依赖安装用 pnpm（workspace 语义），pnpm 只做运行器（pnpm exec）。
# example/ 是独立的 profile bundle 包（版本号依赖，不进 workspace）。
packages:
  - packages/*

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true

minimumReleaseAge: 0

# Pin the session packages to the running dsh core (0.1.2-alpha.3): the rc.2
# closure's KNOWN_SESSION_EVENT_TYPES lacks newer event types (e.g.
# model/selection), which made resume refuse logs written by the newer harness.
overrides:
  "@deepseek-ai/dsh-session": 0.1.2-alpha.3
  "@deepseek-ai/dsh-session-persistence": 0.1.2-alpha.3