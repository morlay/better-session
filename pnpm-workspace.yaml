packages:
  - apps/*
  - packages/*
  - vendor/deepseek-harness/vendor/*
  - vendor/deepseek-harness/packages/*/*
  - vendor/deepseek-harness/native/landlock-run
  - vendor/deepseek-harness/native/landlock-run/packages/*
  - vendor/deepseek-harness/apps/*

linkWorkspacePackages: true
autoInstallPeers: true
nodeLinker: hoisted
injectWorkspacePackages: true

allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@deepseek-ai/dsh-subprocess-local@file:vendor/deepseek-harness/packages/subprocess/subprocess-local": true
  "@google/genai": true
  esbuild: true
  koffi: true
  lefthook: true
  node-pty: true
  protobufjs: true

minimumReleaseAge: 0
