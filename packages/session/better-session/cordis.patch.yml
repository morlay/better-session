- id: session-persistence-jsonl
  disabled: true

- id: session-projection-cache
  disabled: true

- id: session-query-sqlite
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: storage-json
  disabled: true

- id: storage-domain
  config:
    backend: rdb

# 对话 UI 的 client 半 fork（见 docs/debt/0001）：官方 input-trigger 的引用域
# 词表是封闭联合，改由本仓库的包接管（宿主半一并接管，行整体禁用）。
- id: ui-input-trigger
  disabled: true

# 官方对话外壳与 chat 渲染同样由 fork 接管：
# - ui-conversation：composer 草稿要改成块序列、队列行去掉 inline edit；
# - ui-chat：用户气泡 / assistant 渲染（思考块 Markdown、资源 chip、文件卡片）。
- id: ui-conversation
  disabled: true

- id: ui-chat
  disabled: true

- insert:
    - id: session-branch
      name: "@morlay/session-branch"

    - id: session-rdb
      name: "@morlay/session-rdb"
      config:
        type: sqlite
        path: !!js dshHomePath('sessions', 'sessions.sqlite')

    - id: ui-conversation-message-actions
      name: "@morlay/ui-conversation-message-actions"

    - id: ui-conversation-fork
      name: "@morlay/dsh-client-ui-conversation"

    - id: ui-chat-fork
      name: "@morlay/dsh-client-ui-chat"

    - id: ui-input-trigger-fork
      name: "@morlay/dsh-client-ui-input-trigger"

    # css-in-js 样式层（styled / Token / 官方 token 消费）：fork 包的样式基础。
    - id: ui-primitives-fork
      name: "@morlay/dsh-client-ui-primitives"
