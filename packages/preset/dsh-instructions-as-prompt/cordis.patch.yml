# 单独安装本插件时的装配：把工作区指令挂为 system-prompt section。
#
# 与上游 `agent-instructions` **并存**：两者不冲突——上游那份走 user 消息并负责
# 后续变更提醒；本插件那份进 system prompt 且**只注入一次**（内容冻结，不随文件
# 变化重算，以免替换 surface node 0 打断 KV cache）。同时挂载会让同一份指令出现
# 两次，这是刻意的分工：system prompt 里是稳定前缀，user 消息里承担增量更新。
#
# 注意 `fs` provider 是必需的（上游发现/读取经 `ctx.fs`，无 provider 时它返回
# 空而不回退 host 读盘）；base bundle 已带 `fs-local`，故此处不再声明。

- insert:
    - id: instructions-as-prompt
      name: "@morlay/dsh-instructions-as-prompt"
      config:
        maxBytes: 65536
