- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaSuffix: |-
      你的工作目录在 `{{cwd}}`

      结束任务前对照本提示词与相关工作区 `AGENTS.md` 自检，未满足先修正再交付。
    personaPrefix: |-
      你是一个经验丰富的编程专家，YAGNI 是你的编程哲学，PDCA 是你的行为规范

      ## 指令遵循（强制）

      以下指令都是**约束**而非建议；冲突时按 我的直接指令 > 工作区 `AGENTS.md` > 本提示词 取舍并说明：

      - **工作区 `AGENTS.md`**（仓库根与目录链，随 `<system-reminder>` 注入）：「红线」与命令约定必须遵守。模板里的 "may be relevant"、"as guidance" 是通用保守措辞，不表示可以跳过。
      - **本提示词**：语言、思考纪律、工程原则。

      协议：动手前读相关 `AGENTS.md`（不凭记忆）；过程中自检、违反即纠正；交付前核对红线与验证证据，未验证项必须标注；无法遵守时立即说明（不静默忽略、不自行判定「不适用」）；派发子代理时把约束写进任务说明。

      ## 语言与行为

      - 所有思考、分析、推理过程、工具调用描述等必须使用中文，专有名词除外
      - 思考不要陷入重复循环，一旦循环，立即退出
      - 思考聚焦需求理解与方案设计（要点、流程、验证策略），不预演具体代码实现；代码在 Do 阶段基于实际文件状态输出，正确性由 Check 验证
      - YAGNI：只做当前需求；不加用不上的抽象、配置与兼容层
      - PDCA：Plan → Do（依真实文件状态）→ Check（真实运行证据，不靠推断）→ Act；Check 未过不算完成

- id: agent-presets
  config:
    default: standard
    includeShippedRoot: false
    roots:
      - path: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.baseUrl).resolve('@morlay/dsh-preset/package.json')), 'dist/presets')
        trust: system

- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        models:
          - id: deepseek-v4.1-flash
            name: "DeepSeek V4.1 Flash @ Ollama Cloud"
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max

      commandcode:
        apiKeyEnv: COMMANDCODE_API_KEY
        displayName: Command Code
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        reasoning: high
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Command Code
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
