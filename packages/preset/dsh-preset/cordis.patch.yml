# persona 的中文表达部分对齐 union-alpha 的说话风格：从 openrouter-custom/stealth/union-alpha
# 在 12 个场景（报进度 / 解释 / 评审 / 分歧 / 排期 / 拒绝 / 复盘 / 提问 …）下的输出里提炼，
# 两轮复测稳定复现的才是要点。改这段后重启 dsh 生效（见 README）。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaSuffix: |-
      你的工作目录在 `{{cwd}}`，工作目录内的  AGENTS.md 的规则非常重要，必须严格遵守
    personaPrefix: |-
      你是一个经验丰富的编程专家，YAGNI 是你的编程哲学，PDCA 是你的行为规范

      ## 语言和行为

      - 所有思考、分析、推理过程、工具调用描述等必须使用中文，专有名词除外
      - 思考不要陷入重复循环，一旦循环，立即退出
      - 思考聚焦需求理解与方案设计（要点、流程、验证策略），不预演具体代码实现；代码在 Do 阶段基于实际文件状态输出，正确性由 Check 验证

- id: agent-presets
  config:
    default: standard
    includeShippedRoot: false
    roots:
      - path: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(ctx.baseUrl).resolve('@morlay/dsh-preset/package.json')), 'dist/presets')
        trust: system

- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: OLLAMA_API_KEY
        displayName: Ollama Cloud
        api: openai-completions
        baseURL: https://ollama.com/v1
        reasoning: high
        models:
          - id: deepseek-v4.1-flash
            name: "DeepSeek V4.1 Flash @ Ollama Cloud"
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max

      commandcode:
        apiKeyEnv: COMMANDCODE_API_KEY
        displayName: Command Code
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        reasoning: high
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash @ Command Code
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max

# 沙箱装配（唯一真源，就地完成）：官方 `sandbox`（ctx.sandbox）与 `fs-sandbox`
# （ctx.fs）两行在这里禁用，由 `@morlay/dsh-sandbox-local` 注册同名服务；规则随本
# insert 行一起写死，不再依赖任何额外 bundle 层（漏装配时规则会静默失效，只剩
# workspace + /tmp 可写）。
- id: sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

# 沙箱规则：`rw <path>` 追加工作区之外的可写根，`-- <pattern>` 拒绝访问（读 + 写）。
- insert:
    - id: sandbox-local
      name: "@morlay/dsh-sandbox-local"
      config:
        access: |-
          rw /tmp
          rw {{ env.XDG_CACHE_HOME }}
          rw {{ env.XDG_STATE_HOME }}
          rw {{ env.XDG_DATA_HOME }}
          r- {{ env.XDG_CONFIG_HOME }}
          -- mise.*.toml
          -- **/*.pem

# 提示词分层：系统提示词只留上面的 persona，工具说明 / Agent Teams 规则 / plan
# 规则等由该插件降级为 <system-reminder> user 消息。部署级策略，在这里定义一次
# 即覆盖全部 preset（含子 agent），preset composition 不再各自带这一行。
- insert:
    - id: prompt-reminder
      name: "@morlay/dsh-prompt-reminder"

# 引用后注入：用户消息里的 `skill:name` 在 pre-step 展开成
# `<skill_content>` 注入消息，消息文本保持 link 原文（模型文本不膨胀）。
- insert:
    - id: reference-injection
      name: "@morlay/dsh-reference-injection"
